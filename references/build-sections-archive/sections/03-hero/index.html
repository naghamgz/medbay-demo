<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedBay International — Section 3: Hero Carousel</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="section-preview-body">

<!--
  Section 3 — main > section:nth-child(1), the hero slide carousel
  Source: site-dna.json layout['1440px'].sections[3]
    (tag: section, class "relative w-full", rect 1440x720 @ top:-4,left:0,
     childCount:1, childLayout[0]: div 1440x720 position:relative)

  Fixed-height hero (720px at 1440/1024/768px breakpoints per DNA; the -4/-15/+9px
  "top" jitter across breakpoints is capture noise from the sticky header overlapping
  the hero, not a real offset, and was not reproduced here).

  REVISION (round 2, fix notes from comparator @ 38.18% match): the reference
  screenshot (references/screenshots/1440-section-3-relative.png) captured the
  carousel with the RELFYDESS slide (index 1) active, not SOFWAVE (index 0).
  This round makes slide 1 the default/active slide, builds its full copy block
  (previously wrongly excluded as "off-canvas"), corrects the pagination to 11
  dots (was 8), and repositions the dots to true horizontal-center. Details in
  notes.md.

  Content sourced from:
  - typography[] entries filtered to context.position.top in [-10, 720]:
    h1.heading-h1 (occurrences: 11, top:349,left:144), p.body-text subtitle
    (occurrences: 11, top:435,left:144), a.link "READ MORE" (occurrences: 11,
    top:487,left:144) / "BOOK DEMO" (occurrences: 8, top:487,left:282) —
    BOOK DEMO's occurrence count (8 of 11 slides) confirms 3 slides, including
    RELFYDESS, have a single CTA only. p.body-text "Approved by the Emirates
    Drug Establishment (EDE)" (occurrences: 2, top:458, fontSize 12px/16px/500,
    color matches --color-text-2) — this entry's left:1600 was capture noise
    (off-canvas at 1440 viewport); repositioned to the content column (left:144)
    per the reference screenshot crop. The paired "Registration No.: ..." line
    is not present anywhere in site-dna.json (confirmed via full-text search) —
    its exact wording was read directly off the reference screenshot pixels
    (references/screenshots/1440-section-3-relative.png, crop y440-500,
    upscaled) since no DNA text source exists for it; flagged in notes.md.
  - components['1440px'].buttons: pagination is buttons[25..35] — an 11-item
    strip (1 active 24x8 pill + 10 inactive 8x8 dots), not 8 as previously
    miscounted. Sub-pixel analysis of the reference screenshot (bright-pixel
    scan at y=691) found the active pill's true left edge at x=644, which
    back-solves to a horizontally CENTERED strip (628–812 of 1440), not
    left-aligned to the content column as previously built.
  - components['1440px'].media[5]: "SOFWAVE background" img, 1456x720,
    object-fit: cover -> assets/images/sofwave-488360.png.
  - components['1440px'].media[6]: "RELFYDESS background", second carousel
    slide -> assets/images/relfydess-desktop.jpg. Round 2: fetched the full-res
    1920x600 original directly from the CDN URL recorded in
    dna.components['1440px'].media[6] / dna.assets.images[3]
    (https://cdn.dubaimed.com/assets/hero-banners/Relfydess-Desktop.jpg, 292KB)
    rather than reusing the 15KB avif `_next/image` thumbnail from round 1.
  - assets/svg/icon-relative-6.svg / icon-relative-7.svg: lucide chevron-left /
    chevron-right, inlined below for the prev/next arrows.

  See notes.md for what was NOT built (slide copy for slides 2,4,6-10 still
  unbacked by DNA; registration-number text sourced from pixels, not DNA JSON).
-->
<section class="hero" data-component="hero-carousel" data-active-slide="1">
  <div class="hero__viewport">
    <div class="hero__track">

      <!-- Slide 0 — SOFWAVE. Fully backed by DNA; no longer the default/active
           slide (round 2 fix — reference screenshot shows slide 1 active). -->
      <div class="hero__slide" data-slide-index="0" aria-hidden="true" inert>
        <img class="hero__bg" src="../../../assets/images/sofwave-488360.png" alt="SOFWAVE background">
        <div class="hero__overlay" aria-hidden="true"></div>
        <div class="hero__content">
          <h1 class="hero__title">SOFWAVE</h1>
          <p class="hero__subtitle">Next-generation ultrasound technology for skin tightening an&hellip;</p>
          <div class="hero__ctas">
            <a class="btn btn--light" href="#">READ MORE</a>
            <a class="btn btn--dark" href="#">BOOK DEMO</a>
          </div>
        </div>
      </div>

      <!-- Slide 1 — RELFYDESS. DEFAULT/ACTIVE slide (round 2 fix). Headline,
           subtitle, and single READ MORE CTA are DNA-backed (typography[] +
           components.buttons[6]). The two legal lines are the reference
           screenshot's actual copy for this slide (see header note above). -->
      <div class="hero__slide is-active" data-slide-index="1">
        <img class="hero__bg" src="../../../assets/images/relfydess-desktop.jpg" alt="RELFYDESS background">
        <div class="hero__overlay" aria-hidden="true"></div>
        <div class="hero__content">
          <h1 class="hero__title">RELFYDESS</h1>
          <p class="hero__subtitle">Next generation moderate-to-severe dynamic wrinkles treatment.</p>
          <div class="hero__legal">
            <p class="hero__legal-line">Approved by the Emirates Drug Establishment (EDE)</p>
            <p class="hero__legal-line">Registration No.: 72881-1572-189267 - For medical use only.</p>
          </div>
          <div class="hero__ctas">
            <a class="btn btn--light" href="#">READ MORE</a>
          </div>
        </div>
      </div>

      <!-- Slides 2-10 — dot pagination (components['1440px'].buttons[25..35])
           confirms 11 total slides (round 2 recount; typography occurrences:11
           was the correct signal all along). No image/copy exists in DNA for
           any slide beyond indices 0 and 1, so these remain inert structural
           stubs only — no visual content is rendered for them. -->
      <div class="hero__slide hero__slide--stub" data-slide-index="2" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="3" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="4" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="5" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="6" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="7" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="8" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="9" aria-hidden="true" inert></div>
      <div class="hero__slide hero__slide--stub" data-slide-index="10" aria-hidden="true" inert></div>
    </div>

    <button class="hero__arrow hero__arrow--prev" type="button" aria-label="Previous slide">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <button class="hero__arrow hero__arrow--next" type="button" aria-label="Next slide">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>

    <div class="hero__pagination" role="tablist" aria-label="Hero slides">
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 1" data-slide-target="0"></button>
      <button class="hero__dot is-active" type="button" role="tab" aria-selected="true" aria-label="Go to slide 2" data-slide-target="1"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 3" data-slide-target="2"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 4" data-slide-target="3"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 5" data-slide-target="4"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 6" data-slide-target="5"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 7" data-slide-target="6"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 8" data-slide-target="7"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 9" data-slide-target="8"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 10" data-slide-target="9"></button>
      <button class="hero__dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 11" data-slide-target="10"></button>
    </div>
  </div>
</section>

</body>
</html>
